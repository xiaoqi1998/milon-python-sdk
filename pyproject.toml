[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milon-python-sdk"
version = "0.2.0"
description = "Python SDK for the Milon blockchain: keys, IDL codec, transactions, RPC queries"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/xiaoqi1998/milon-python-sdk"
Repository = "https://github.com/xiaoqi1998/milon-python-sdk"
dependencies = [
    "blake3>=1.0",
    "coincurve>=18.0",
    "cryptography>=42.0",
    "py_ecc>=7.0",
    "base58>=2.1",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
milon_sdk = ["provider/IDL/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
